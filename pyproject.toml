[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "local-stock-agent"
version = "0.1.0"
description = "本地量化股票分析智能体"
requires-python = ">=3.12,<3.13"
dependencies = [
  "duckdb>=1.1,<2",
  "keyring>=25,<27",
  "mcp>=1.0,<2",
  "pydantic>=2.10,<3",
  "pytz>=2024.1,<2027",
  "pyarrow>=18,<20",
  "PySide6>=6.8,<7",
]

[project.optional-dependencies]
dev = [
  "hypothesis>=6.120,<7",
  "black>=24.10,<26",
  "mypy>=1.13,<2",
  "pytest>=8.3,<9",
  "pytest-cov>=6.0,<7",
  "ruff>=0.8,<1",
]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --cov=stock_agent --cov-report=term-missing"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["stock_agent"]

[tool.coverage.report]
fail_under = 80

[tool.hatch.build.targets.wheel]
packages = ["src/stock_agent"]
