[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bagholder-trading-platform"
version = "0.1.0"
description = "基于 TradingAgents-Astock 与 vn.py 的 A 股智能体交易平台"
requires-python = ">=3.12,<3.13"
dependencies = [
  "pydantic>=2.10,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "hypothesis>=6.120,<7",
  "ruff>=0.8,<1",
  "mypy>=1.13,<2",
]

[project.scripts]
bagholder = "bagholder.bootstrap:main"

[tool.hatch.build.targets.wheel]
packages = ["src/bagholder"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
